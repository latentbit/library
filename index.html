<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>My library</h1>
    </header>

    <main>
        <button id="add-book" 
            command="show-modal"
            commandfor="book-dialog" 
            aria-label="Add book">
            +
        </button>

    </main>

    <dialog id="book-dialog" closedby="any">
        <button id="close-modal"
                command="close"
                commandfor="book-dialog"
                aria-label="Close">
            X
        </button>
        <form action="">
            <h2>Create new book:</h2>
            <p>
                <label for="title">Title: </label>
                <input type="text"
                        name="title" 
                        id="title"
                        required>
            </p>
            <p>
                <label for="author">Author: </label>
                <input type="text" 
                        name="author" 
                        id="author"
                        required>
            </p>
            <p>
                <label for="number-of-pages">Number of pages: </label>
                <input type="number" 
                        name="number-of-pages" 
                        min="1"
                        id="number-of-pages">
            </p>
            <p>
                <label>
                    <input type="checkbox" name="read-status">
                    Have you read the book before?
                </label>
            </p>
            <button type="submit">Submit</button>
        </form>
    </dialog>
</body>
</html>
